name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests (assistant logic, content and privacy rules)
        run: npm test

      - name: Minified CSS is up to date
        run: |
          npm run build
          git diff --exit-code -- '*.min.css' || {
            echo "::error::Minified CSS is out of date. Run 'bash scripts/minify.sh' and commit the result."
            exit 1
          }
