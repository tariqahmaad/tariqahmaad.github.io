<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#18d26e">
  <title>Page not found | Tariq Ahmad</title>
  <link href="/favicon.ico" rel="icon" sizes="any">
  <style>
    @font-face { font-family: "Anton"; font-style: normal; font-weight: 400; font-display: swap;
      src: url("/assets/fonts/anton-latin.woff2") format("woff2"); unicode-range: U+0000-00FF; }
    :root { --primary: #18d26e; --cyan: #18c8ff; --bg: #040404; --text: #fff; --muted: rgba(255, 255, 255, 0.78); }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--text);
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 0, rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 3px);
    }
    main { position: relative; width: min(640px, 100%); }
    .code { margin: 0; font-family: "Anton", Impact, sans-serif; font-weight: 400; font-size: clamp(5rem, 24vw, 11rem); line-height: 0.95; color: var(--primary); }
    .term { margin: 24px 0 32px; padding: 18px 20px; border: 1px solid rgba(24, 210, 110, 0.45); background: #0a0c0b; font-size: 0.9rem; line-height: 1.7; color: var(--muted); overflow-wrap: anywhere; }
    .term b { color: var(--primary); font-weight: 700; }
    .term i { color: var(--cyan); font-style: normal; }
    a {
      display: inline-block; padding: 12px 22px; border: 1px solid var(--primary); color: var(--primary);
      text-decoration: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    }
    a:hover, a:focus-visible { background: var(--primary); color: #000; outline: none; }
    a:focus-visible { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px #fff; }
    .paths { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 24px; }
    .paths a { padding: 10px 16px; border-color: rgba(24, 210, 110, 0.45); }
  </style>
</head>
<body>
  <main>
    <h1 class="code">404</h1>
    <p class="term" role="status">
      <b>$</b> cd <i id="path">/requested-page</i><br>
      bash: no such directory<br>
      <b>$</b> ls /portfolio
    </p>
    <nav class="paths" aria-label="Portfolio sections">
      <a href="/#about">About</a>
      <a href="/#resume">Resume</a>
      <a href="/#projects">Projects</a>
      <a href="/#contact">Contact</a>
    </nav>
    <a href="/">Back to the portfolio</a>
  </main>
  <script>
    // Show the path that was requested (set as text, never as HTML).
    document.getElementById('path').textContent = location.pathname.slice(0, 80);
  </script>
</body>
</html>
