<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#18d26e">
  <title>Page not found | Tariq Ahmad</title>
  <link href="/favicon.ico" rel="icon" sizes="any">
  <style>
    :root { --primary: #18d26e; --bg: #040404; --text: #fff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text);
      font-family: "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    h1 { margin: 0; font-size: clamp(4rem, 20vw, 8rem); line-height: 1; color: var(--primary); }
    p { margin: 12px 0 28px; color: rgba(255, 255, 255, 0.8); }
    a {
      display: inline-block; padding: 12px 28px; border-radius: 999px; border: 2px solid var(--primary);
      color: var(--primary); text-decoration: none; font-weight: 600;
    }
    a:hover, a:focus-visible { background: var(--primary); color: #000; outline: none; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page doesn't exist or has moved.</p>
    <a href="/">Back to the portfolio</a>
  </main>
</body>
</html>
